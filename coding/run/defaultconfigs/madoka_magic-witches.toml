
#普通魔女的默认属性。
[defaults]
	#默认基础护甲。
	#Range: 0.0 ~ 30.0
	armor = 0.0
	#填 0 沿用 madoka_magic-common.toml 中的 witch.witch_health。
	#Range: 0.0 ~ 1024.0
	max_health = 0.0

#救济的魔女
[kriemhild_gretchen]
	#填 0 使用默认生命值。
	#Range: 0.0 ~ 1024.0
	max_health = 0.0
	#填 -1 使用默认护甲，填 0 表示没有护甲。
	#Range: -1.0 ~ 30.0
	armor = -1.0

