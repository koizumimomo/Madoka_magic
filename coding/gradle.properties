# ============================================================
# Gradle / JVM settings
# ============================================================
# Forge 1.20.1 must be compiled with Java 17.
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=true
org.gradle.caching=true

# JDK 位置因机器而异，不写进仓库。每台机器在自己的 GRADLE_USER_HOME 下放一份
# gradle.properties，写 org.gradle.java.home 和 org.gradle.java.installations.paths。
# 这里只关掉自动下载 JDK，避免 Gradle 去网上找工具链。
org.gradle.java.installations.auto-download=false

# ============================================================
# Environment Properties
# ============================================================
# The Minecraft version must agree with the Forge version to get a valid artifact
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.10
forge_version_range=[47,)
loader_version_range=[47,)
mapping_channel=official
mapping_version=1.20.1

# ============================================================
# Dependencies
# ============================================================
# Iron's Spells 'n Spellbooks 1.20.1 - the base mod this addon extends
iron_spellbooks_version=1.20.1-3.16.3
# Curios - used for the soul gem accessory slot
curios_version=5.14.1+1.20.1
# GeckoLib - pinned by Modrinth version id (8BmcQJ2H:aC5KMoNg = Forge 1.20.1, 4.8.4).
# The plain version number resolves to a Java-21 build for another game version.
geckolib_version=4.8.4
jei_version=15.20.0.106
# Runtime-only dependencies of Iron's Spells 'n Spellbooks
caelus_version=3.2.0+1.20.1
playeranimator_version=1.0.2-rc1+1.20-forge
# Iron's Lib - mandatory dependency of Iron's Spells 'n Spellbooks itself
irons_lib_version=1.20.1-2.1.0

# ============================================================
# Mod Properties
# ============================================================
mod_id=madoka_magic
# NOTE: Gradle reads .properties as ISO-8859-1, so any Chinese text here
# must be written as \uXXXX escapes. Otherwise mods.toml / pack.mcmeta get mojibake.
mod_name=\u9B54\u6CD5\u5C11\u5973\u5C0F\u5706
mod_license=All Rights Reserved
mod_version=1.0.0
mod_group_id=io.madoka.magic
mod_authors=\u6843\u9ECE
mod_description=\u9B54\u6CD5\u5C11\u5973\u5C0F\u5706\u4E3B\u9898\u7684 Minecraft \u6A21\u7EC4\u3002\u4EE5\u7075\u9B42\u5B9D\u77F3\u4E0E\u6C61\u79FD\u4E3A\u6838\u5FC3\u5FAA\u73AF\uFF0C\u628A"\u7B7E\u8BA2\u5951\u7EA6"\u6539\u5199\u4E3A"\u9009\u62E9\u4E00\u9897\u5B66\u6D3E\u5B9D\u77F3"\u3002\nChinese: \u7075\u9B42\u5B9D\u77F3 / \u6C61\u79FD / \u9B54\u5973\u5316\u3002
